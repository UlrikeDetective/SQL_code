<div class="card text-center">
    <h3>{{ title }}</h3>
    <p class="package-price {{ price_class|default:'text-primary' }}">{{ price }}</p>
    <p class="package-desc">{{ description }}</p>
    <form action="{% url 'buy_package' %}" method="post" class="package-form">
        {% csrf_token %}
        <input type="hidden" name="total_lessons" value="{{ lessons }}">
        <input type="hidden" name="package_type" value="{{ package_type }}">

        {% if session_email %}
            <p class="small">Zen: <strong>{{ session_email }}</strong></p>
            <input type="hidden" name="email" value="{{ session_email }}">
        {% else %}
            <input type="text" name="name" placeholder="Your Name" aria-label="Your Name" class="input">
            <input type="email" name="email" required placeholder="Your Email" aria-label="Your Email" class="input">
        {% endif %}

        <button type="submit" class="btn">Buy Now</button>
    </form>
</div>
